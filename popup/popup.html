<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PII Shield Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card" id="popup-card">
    <header class="header">
      <div class="logo-area">
        <div class="shield-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="title-container">
          <h1 id="main-title">PII Shield</h1>
          <span class="subtitle">Privacy Guard for All Sites</span>
        </div>
      </div>
      <div class="toggle-container">
        <label class="switch" for="master-switch">
          <input type="checkbox" id="master-switch" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </header>

    <main class="main-content">
      <!-- Statistics Section -->
      <section class="section stats-section">
        <h2>Privacy Statistics</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-value" id="blocked-count">0</span>
            <span class="stat-label">Items Redacted</span>
          </div>
          <button class="btn btn-secondary" id="reset-stats-btn">
            Reset Stats
          </button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Active on all websites</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
