<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Prompt Phone Masker Settings</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="card" id="popup-card">
    <header class="header">
      <div class="logo-area">
        <div class="shield-icon">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        </div>
        <div class="title-container">
          <h1 id="main-title">Phone Masker</h1>
          <span class="subtitle">AI Privacy Proxy</span>
        </div>
      </div>
      <div class="toggle-container">
        <label class="switch" for="master-switch">
          <input type="checkbox" id="master-switch" checked>
          <span class="slider round"></span>
        </label>
      </div>
    </header>

    <main class="main-content">
      <!-- Mode Selection Section -->
      <section class="section">
        <h2>Masking Modes</h2>
        
        <div class="option-row">
          <div class="option-info">
            <label class="option-label" for="dom-masking-switch">DOM-Level Masking</label>
            <p class="option-desc">Masks phone numbers directly in the input boxes as you type or paste.</p>
          </div>
          <label class="switch small-switch" for="dom-masking-switch">
            <input type="checkbox" id="dom-masking-switch" checked>
            <span class="slider round"></span>
          </label>
        </div>

        <div class="option-row">
          <div class="option-info">
            <label class="option-label" for="network-masking-switch">Network Interception (Proxy)</label>
            <p class="option-desc">Keeps UI clean but silently redacts phone numbers in outgoing API requests.</p>
          </div>
          <label class="switch small-switch" for="network-masking-switch">
            <input type="checkbox" id="network-masking-switch" checked>
            <span class="slider round"></span>
          </label>
        </div>
      </section>

      <!-- Mask Customization Section -->
      <section class="section">
        <h2>Customization</h2>
        <div class="select-wrapper">
          <label class="field-label" for="mask-type">Replacement Text</label>
          <select id="mask-type" class="styled-select">
            <option value="asterisks">Asterisks (***)</option>
            <option value="placeholder">[phone number]</option>
            <option value="redacted">[REDACTED]</option>
          </select>
        </div>
      </section>

      <!-- Statistics Section -->
      <section class="section stats-section">
        <h2>Privacy Statistics</h2>
        <div class="stats-grid">
          <div class="stat-card">
            <span class="stat-value" id="blocked-count">0</span>
            <span class="stat-label">Numbers Masked</span>
          </div>
          <button class="btn btn-secondary" id="reset-stats-btn">
            Reset Stats
          </button>
        </div>
      </section>
    </main>

    <footer class="footer">
      <p>Works on ChatGPT, Claude, and Gemini</p>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
